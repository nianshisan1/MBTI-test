<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI 职业性格测试</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f5f7fa; color: #333; }
        .container { background-color: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
        .user-info { margin-bottom: 30px; padding: 20px; background-color: #f8f9fa; border-radius: 8px; }
        .user-info input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .question-block { display: none; margin-bottom: 20px; padding: 20px; border: 1px solid #e1e4e8; border-radius: 8px; }
        .question-block.active { display: block; }
        .question-text { font-size: 1.1em; font-weight: bold; margin-bottom: 15px; }
        .option { display: block; padding: 15px; margin-bottom: 10px; background-color: #f8f9fa; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .option:hover { background-color: #e9ecef; }
        .option input { margin-right: 10px; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 20px; }
        button { padding: 12px 24px; border: none; border-radius: 6px; font-size: 1em; cursor: pointer; transition: background-color 0.2s; }
        .btn-prev { background-color: #6c757d; color: white; }
        .btn-prev:hover { background-color: #5a6268; }
        .btn-next, .btn-submit { background-color: #007bff; color: white; }
        .btn-next:hover, .btn-submit:hover { background-color: #0056b3; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        #result-container { display: none; text-align: center; }
        .type-result { font-size: 3em; font-weight: bold; color: #007bff; margin: 20px 0; }
        .btn-export { background-color: #28a745; color: white; margin-top: 20px; }
        .btn-export:hover { background-color: #218838; }
        .progress { text-align: center; margin-bottom: 20px; color: #666; font-weight: bold; }
        .error { color: #dc3545; font-size: 0.9em; margin-top: 5px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>MBTI 职业性格测试</h1>
        
        <div id="intro-screen">
            <div class="user-info">
                <h3>请填写基本信息开始测试</h3>
                <input type="text" id="userName" placeholder="姓名 (必填)" required>
                <div id="nameError" class="error">请输入姓名</div>
                <input type="text" id="department" placeholder="部门">
                <button class="btn-next" onclick="startTest()" style="width: 100%; margin-top: 15px;">开始测试</button>
            </div>
        </div>

        <div id="test-screen" style="display: none;">
            <div class="progress" id="progress">题目: 1 / 70</div>
            <div id="questions-container"></div>
            <div class="nav-buttons">
                <button class="btn-prev" id="btnPrev" onclick="prevQuestion()" disabled>上一题</button>
                <button class="btn-next" id="btnNext" onclick="nextQuestion()">下一题</button>
                <button class="btn-submit" id="btnSubmit" onclick="submitTest()" style="display: none;">提交查看结果</button>
            </div>
        </div>

        <div id="result-screen" style="display: none;">
            <h2>测试完成！</h2>
            <p>您的MBTI性格类型是：</p>
            <div class="type-result" id="mbti-type"></div>
            <p id="mbti-desc" style="color: #666; margin-bottom: 30px;"></p>
            <button class="btn-export" onclick="exportToExcel()">导出测试结果至Excel</button>
            <button class="btn-next" onclick="location.reload()" style="margin-left: 10px;">重新测试</button>
        </div>
    </div>

            {id: 66, text: "什么对你来说更困难", options: [{val: "a", text: "与他人保持一致"}, {val: "b", text: "利用他人"}]},

            {id: 68, text: "什么是更严重的缺点", options: [{val: "a", text: "不分青红皂白"}, {val: "b", text: "吹毛求疵"}]},
            {id: 69, text: "你偏爱", options: [{val: "a", text: "计划好的事情"}, {val: "b", text: "没有计划过的事情"}]},
            {id: 70, text: "你是", options: [{val: "a", text: "深思熟虑甚于一时冲动"}, {val: "b", text: "一时冲动甚于深思熟虑"}]}
        ];

        let currentQuestionIndex = 0;
        let answers = {};
        let userInfo = {};
        let finalResult = "";
        let finalScores = {};

        function initTest() {
            const container = document.getElementById('questions-container');
            questionsData.forEach((q, index) => {
                const block = document.createElement('div');
                block.className = `question-block ${index === 0 ? 'active' : ''}`;
                block.id = `question-${index}`;
                
                let html = `<div class="question-text">${q.id}. ${q.text}</div>`;
                q.options.forEach(opt => {
                    html += `
                        <label class="option" onclick="autoNext(${index})">
                            <input type="radio" name="q${q.id}" value="${opt.val}">
                            ${opt.val.toUpperCase()}. ${opt.text}
                        </label>
                    `;
                });
                block.innerHTML = html;
                container.appendChild(block);
            });
        }

        function startTest() {
            const nameInput = document.getElementById('userName');
            if (!nameInput.value.trim()) {
                document.getElementById('nameError').style.display = 'block';
                return;
            }
            
            userInfo = {
                name: nameInput.value.trim(),
                department: document.getElementById('department').value.trim(),
                date: new Date().toLocaleDateString()
            };
            
            document.getElementById('intro-screen').style.display = 'none';
            document.getElementById('test-screen').style.display = 'block';
            initTest();
        }

        function updateNav() {
            document.getElementById('btnPrev').disabled = currentQuestionIndex === 0;
            document.getElementById('progress').innerText = `题目: ${currentQuestionIndex + 1} / 70`;
            
            if (currentQuestionIndex === questionsData.length - 1) {
                document.getElementById('btnNext').style.display = 'none';
                document.getElementById('btnSubmit').style.display = 'block';
            } else {
                document.getElementById('btnNext').style.display = 'block';
                document.getElementById('btnSubmit').style.display = 'none';
            }
            
            document.querySelectorAll('.question-block').forEach((el, index) => {
                el.classList.toggle('active', index === currentQuestionIndex);
            });
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                updateNav();
            }
        }

        function nextQuestion() {
            const currentQ = questionsData[currentQuestionIndex];
            const selected = document.querySelector(`input[name="q${currentQ.id}"]:checked`);
            
            if (!selected) {
                alert("请先选择一个答案！");
                return;
            }
            
            answers[currentQ.id] = selected.value;
            
            if (currentQuestionIndex < questionsData.length - 1) {
                currentQuestionIndex++;
                updateNav();
            }
        }

        function autoNext(index) {
            if(index === currentQuestionIndex) {
                 setTimeout(() => {
                    if (currentQuestionIndex < questionsData.length - 1) {
                        const currentQ = questionsData[currentQuestionIndex];
                        const selected = document.querySelector(`input[name="q${currentQ.id}"]:checked`);
                        if(selected) {
                           answers[currentQ.id] = selected.value;
                           currentQuestionIndex++;
                           updateNav();
                        }
                    }
                 }, 300);
            }
        }

        function submitTest() {
            const currentQ = questionsData[currentQuestionIndex];
            const selected = document.querySelector(`input[name="q${currentQ.id}"]:checked`);
            if (!selected) {
                alert("请完成最后一题！");
                return;
            }
            answers[currentQ.id] = selected.value;

            calculateResult();
        }

        function calculateResult() {
            // E/I
            const eiQuestions = [1, 8, 15, 22, 29, 36, 43, 50, 57, 64];
            let eScore = 0; let iScore = 0;
            eiQuestions.forEach(q => answers[q] === 'a' ? eScore++ : iScore++);
            // 平局判I
            const eiRes = eScore > iScore ? 'E' : 'I';

            // S/N
            const snQuestions = [2, 3, 9, 10, 16, 17, 23, 24, 30, 31, 37, 38, 44, 45, 51, 52, 58, 59, 65, 66];
            let sScore = 0; let nScore = 0;
            snQuestions.forEach(q => answers[q] === 'a' ? sScore++ : nScore++);
            // 平局判N
            const snRes = sScore > nScore ? 'S' : 'N';

            // T/F
            const tfQuestions = [4, 5, 11, 12, 18, 19, 25, 26, 32, 33, 39, 40, 46, 47, 53, 54, 60, 61, 67, 68];
            let tScore = 0; let fScore = 0;
            tfQuestions.forEach(q => answers[q] === 'a' ? tScore++ : fScore++);
            // 平局判F
            const tfRes = tScore > fScore ? 'T' : 'F';

            // J/P
            const jpQuestions = [6, 7, 13, 14, 20, 21, 27, 28, 34, 35, 41, 42, 48, 49, 55, 56, 62, 63, 69, 70];
            let jScore = 0; let pScore = 0;
            jpQuestions.forEach(q => answers[q] === 'a' ? jScore++ : pScore++);
            // 平局判P
            const jpRes = jScore > pScore ? 'J' : 'P';

            finalResult = eiRes + snRes + tfRes + jpRes;
            finalScores = {
                'E': eScore, 'I': iScore,
                'S': sScore, 'N': nScore,
                'T': tScore, 'F': fScore,
                'J': jScore, 'P': pScore
            };

            document.getElementById('test-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('mbti-type').innerText = finalResult;
        }

        function exportToExcel() {
            // 准备导出数据
            const data = [
                ['MBTI 性格测试报告'],
                [],
                ['基本信息'],
                ['测试人姓名', userInfo.name],
                ['所属部门', userInfo.department || '未填写'],
                ['测试日期', userInfo.date],
                ['最终结果类型', finalResult],
                [],
                ['维度得分详情'],
                ['外向 (E) 得分', finalScores.E, '内向 (I) 得分', finalScores.I],
                ['感觉 (S) 得分', finalScores.S, '直觉 (N) 得分', finalScores.N],
                ['思考 (T) 得分', finalScores.T, '情感 (F) 得分', finalScores.F],
                ['判断 (J) 得分', finalScores.J, '知觉 (P) 得分', finalScores.P],
                [],
                ['详细答题记录'],
                ['题号', '题目', '您的选择']
            ];

            // 添加答题记录
            questionsData.forEach(q => {
                const ansVal = answers[q.id];
                const selectedText = q.options.find(opt => opt.val === ansVal).text;
                data.push([q.id, q.text, `${ansVal.toUpperCase()}: ${selectedText}`]);
            });

            // 创建工作簿并下载
            const ws = XLSX.utils.aoa_to_sheet(data);
            
            // 设置列宽
            ws['!cols'] = [{wch: 10}, {wch: 40}, {wch: 30}, {wch: 15}];
            
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "测试结果");
            
            XLSX.writeFile(wb, `MBTI测试结果_${userInfo.name}_${finalResult}.xlsx`);
        }
    </script>
</body>
</html>
